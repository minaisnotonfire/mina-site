<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>home</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Bonbon&family=Sour+Gummy:wght@400;700&family=Unkempt:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;

      cursor:
        url('https://cdn.cursors-4u.net/previews/puppy-13-a9c1ade9-32.webp')
        32 32,
        auto !important;
    }

    body {
      margin: 0;

      padding: 34px 28px 45px;

      background: #fffdf8;

      font-family: "Sour Gummy", Arial, sans-serif;

      color: #000;
    }

    h1 {
      margin: 0 0 20px;

      font-family: "Sour Gummy", sans-serif;

      font-size: 31px;

      color: #ff66ad;
    }

    .intro {
      font-size: 16px;
      line-height: 1.15;
    }

    .intro p {
      margin: 0 0 15px;
    }


    /* RANDOM FACT GENERATOR */

    .fact-generator {
      width: 82%;

      margin: 55px auto 20px;

      padding: 22px 18px 18px;

      position: relative;

      text-align: center;

      background:
        linear-gradient(
          rgba(255,255,255,.82),
          rgba(255,250,245,.82)
        ),
        url("https://fries-and-ice-cream.neocities.org/newcutestuff/bluepolkarose.gif");

      border: 5px double #ffb6cf;

      border-radius: 18px;

      outline: 2px dashed #b9ece8;
      outline-offset: -10px;

      box-shadow:
        5px 5px 0 rgba(174,238,238,.30),
        inset 0 0 18px rgba(255,192,203,.20);
    }


    .fact-generator::before {
      content: "♡";

      position: absolute;

      left: 15px;
      top: 12px;

      color: #ffa4c8;

      font-size: 18px;
    }


    .fact-generator::after {
      content: "☆";

      position: absolute;

      right: 15px;
      top: 12px;

      color: #a9ded9;

      font-size: 19px;
    }


    .fact-sparkles {
      margin-bottom: 6px;

      color: #ff91bd;

      font-size: 18px;

      letter-spacing: 8px;
    }


    .fact-title {
      display: inline-block;

      padding: 6px 18px;

      background: #fff8e8;

      border: 3px double #e8a8bc;

      border-radius: 20px;

      color: #9a6252;

      font-family: "Unkempt", cursive;

      font-size: 22px;

      font-weight: bold;

      transform: rotate(-1deg);

      box-shadow:
        2px 3px 0 rgba(255,182,193,.25);
    }


    .fact-subtitle {
      margin: 8px 0 14px;

      color: #b47c91;

      font-size: 13px;
    }


    .fact-paper {
      width: 88%;

      min-height: 68px;

      margin: 0 auto 15px;

      padding: 14px;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        repeating-linear-gradient(
          0deg,
          #fffdf6,
          #fffdf6 23px,
          #dff4f3 24px
        );

      border: 2px dashed #f3a7c1;

      border-radius: 10px;

      box-shadow:
        inset 0 0 10px rgba(255,218,230,.35);

      color: #6f5966;

      font-size: 16px;

      line-height: 1.4;
    }


    .fact-button {
      padding: 8px 17px;

      background:
        linear-gradient(
          #fffaf0,
          #ffe7f0
        );

      border: 3px double #91dede;

      border-radius: 12px;

      color: #a25e7d;

      font-family: "Sour Gummy", sans-serif;

      font-size: 15px;

      font-weight: bold;

      box-shadow:
        3px 3px 0 rgba(255,192,203,.35);

      transition:
        transform .2s,
        background .2s,
        box-shadow .2s;
    }


    .fact-button:hover {
      transform:
        translateY(-2px)
        rotate(-1deg)
        scale(1.04);

      background:
        linear-gradient(
          #fff0f7,
          #e8ffff
        );

      box-shadow:
        4px 5px 0 rgba(255,192,203,.35);
    }


    .fact-button:active {
      transform:
        translateY(1px)
        scale(.98);
    }


    .fact-bottom {
      margin-top: 14px;

      color: #a9ded9;

      font-size: 13px;

      letter-spacing: 7px;
    }


    .fact-pop {
      animation: factPop .35s ease;
    }


    @keyframes factPop {

      0% {
        opacity: 0;

        transform: scale(.92);
      }

      60% {
        transform: scale(1.04);
      }

      100% {
        opacity: 1;

        transform: scale(1);
      }

    }

  </style>
</head>


<body>

  <h1>
    haiiii ★
  </h1>


  <div class="intro">

    <p>
      welcome to my website!
    </p>

    <p>
      this is my little corner of the internet for games, pictures, diary entries,
      friends, random interests and whatever else i feel like putting here.
    </p>

  </div>


  <!-- RANDOM FACT ABOUT ME -->

  <div class="fact-generator">

    <div class="fact-sparkles">
      ☆ ♡ ☆
    </div>


    <div class="fact-title">
      random fact abt me!
    </div>


    <div class="fact-subtitle">
      click to learn something random about mina ♡
    </div>


    <div class="fact-paper">

      <span id="randomFact">
        press the button!!
      </span>

    </div>


    <button
      class="fact-button"
      onclick="generateFact()"
    >
      ✧ click to generate ✧
    </button>


    <div class="fact-bottom">
      ♡ ★ ♡ ★ ♡
    </div>

  </div>


  <script>

    const facts = [

      "i get a fortnite victory royale basically every time",

      "i volunteer a lot",

      "i love analyzing birth charts",

      "i am a sagittarius!",

      "i love roblox",

      "foo fighters and incubus are my favorite bands",

      "i love cats an unreasonable amount",

      "i'm obsessed with horror and weird lore",

      "i'm more of a pc gamer than a console gamer",

      "i love story-heavy games",

      "i can hyperfixate on something for hours",

      "i love bugs, especially beetles and ants",

      "i'm a huge fnaf fan",

      "i love sci-fi and star wars",

      "i'm really into psychology",

      "i love collecting little trinkets and cute things",

      "i love cute things and creepy things equally",

      "i'm either super quiet or talking way too much",

      "i love making things by hand",

      "i love weird niche interests",

      "i take way too many pictures of my cat",

      "i can spend forever psychoanalyzing fictional characters",

      "i love comparing people's birth chart placements",

      "i'm always finding some random new thing to obsess over",

      "i love anything whimsical, dreamy, or slightly weird",

      "i love old games and internet nostalgia",

      "i love helping out at events and volunteering",

      "i love horror games but would probably die instantly in one",

      "i could talk about my favorite games for hours",

      "i love learning random facts about people",

      "i love decorating literally everything",

      "i always somehow end up with a new hyperfixation",

      "i love personality systems and overanalyzing people",

      "i will absolutely judge a fictional character by their birth chart",

      "i love roblox games that look like they were made in 2012",

      "i play fortnite like rent is due",

      "i can turn almost anything into a niche interest",

      "i love games where something is deeply wrong for no reason",

      "i love music that makes me stare dramatically out a car window",

      "i have way too many opinions about fictional people",

      "i will defend my favorite game like i worked on it",

      "i'm always one search away from a new obsession",

      "i take personality tests like they are legally binding",

      "i love horror until i actually hear a noise in my house",

      "i could probably make a tier list about anything",

      "i love lore more than i love understanding the actual plot",

      "i will open roblox for five minutes and disappear for three hours",

      "i'm convinced every friend group needs at least one weird lore person"

    ];


    let lastFact = -1;


    function generateFact() {

      let randomIndex;


      do {

        randomIndex =
          Math.floor(
            Math.random() * facts.length
          );

      }

      while (
        randomIndex === lastFact &&
        facts.length > 1
      );


      lastFact = randomIndex;


      const fact =
        document.getElementById("randomFact");


      fact.classList.remove("fact-pop");


      void fact.offsetWidth;


      fact.textContent =
        facts[randomIndex];


      fact.classList.add("fact-pop");

    }

  </script>

</body>

</html>
