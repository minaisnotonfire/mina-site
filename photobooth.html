<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>step into my photobooth ♡</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Bonbon&family=Sour+Gummy:wght@400;700&family=Unkempt:wght@400;700&display=swap" rel="stylesheet">

<style>

* {
  box-sizing: border-box;

  cursor:
    url('https://cdn.cursors-4u.net/previews/puppy-13-a9c1ade9-32.webp')
    32 32,
    auto !important;
}

body {
  margin: 0;
  padding: 60px 20px 100px;

  min-height: 100vh;

  background:
    linear-gradient(
      rgba(255,255,255,.15),
      rgba(255,255,255,.15)
    ),
    repeating-linear-gradient(
      0deg,
      #f8cfd9 0px,
      #f8cfd9 24px,
      #ffdbe4 25px,
      #ffdbe4 48px
    );

  font-family:
    "Sour Gummy",
    sans-serif;

  color: #744f65;

  text-align: center;

  cursor:
    url('https://cdn.cursors-4u.net/previews/puppy-13-a9c1ade9-32.webp')
    32 32,
    auto !important;
}


/* TITLE */

h1 {
  margin: 5px 0 8px;

  font-family:
    "Bonbon",
    cursive;

  font-size: 43px;

  color: #ff70ad;

  text-shadow:
    2px 2px 0 #fff7c7,
    3px 3px 0 #a9dbf7;
}

.intro {
  margin-bottom: 45px;

  color: #9b6683;

  font-family:
    "Unkempt",
    cursive;

  font-size: 17px;
}


/* WHOLE PHOTOBOOTH */

.photobooth {
  position: relative;

  width: 470px;

  margin: 0 auto;

  padding:
    20px
    20px
    30px;

  background:
    linear-gradient(
      #fff7d8,
      #f9eac1
    );

  border:
    5px solid #795748;

  border-radius:
    12px
    12px
    25px
    25px;

  box-shadow:
    8px 9px 0
    rgba(115,77,91,.18);
}


/* PHOTOBOOTH SIGN */

.booth-sign {
  width: 340px;

  margin:
    -62px
    auto
    12px;

  padding:
    10px
    12px;

  background:
    linear-gradient(
      #fff8d8,
      #f7e8ba
    );

  border:
    4px solid #745344;

  border-radius: 8px;

  font-family:
    "Unkempt",
    cursive;

  font-size: 38px;
  font-weight: bold;

  color: #704936;

  transform:
    rotate(-1deg);

  box-shadow:
    3px 3px 0
    #ffa5c8;
}


/* PHOTOBOOTH OPENING */

.booth-window {
  position: relative;

  width: 350px;
  height: 390px;

  margin:
    10px
    auto
    18px;

  overflow: hidden;

  background-color:
    #def49a;

  background-image:
    radial-gradient(
      circle,
      #ff82b5 5px,
      transparent 6px
    );

  background-size:
    62px 62px;

  border:
    5px solid #754e42;

  border-radius: 8px;

  box-shadow:
    inset 0 0 0
    5px #a8dbf7;
}


/* DECORATIVE STARS */

.star {
  position: absolute;

  z-index: 1;

  font-size: 31px;

  color: #ff7db1;

  opacity: .75;

  pointer-events: none;
}

.s1 {
  left: 20px;
  top: 55px;
}

.s2 {
  right: 28px;
  top: 90px;
}

.s3 {
  left: 45px;
  bottom: 65px;
}

.s4 {
  right: 44px;
  bottom: 28px;
}

.s5 {
  left: 145px;
  top: 48px;
}


/* CAMERA */

#camera {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  transform:
    scaleX(-1);

  display: none;

  z-index: 2;
}


/* PLACEHOLDER */

.camera-placeholder {
  position: absolute;

  inset: 0;

  z-index: 3;

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;

  gap: 8px;

  padding: 25px;

  color: #986380;

  font-size: 17px;
}

.camera-placeholder .heart {
  font-size: 54px;

  animation:
    heartBounce
    1.5s
    ease-in-out
    infinite;
}

@keyframes heartBounce {

  0%,
  100% {
    transform:
      translateY(0)
      rotate(-5deg);
  }

  50% {
    transform:
      translateY(-8px)
      rotate(5deg);
  }

}


/* CURTAINS */

.curtain {
  position: absolute;

  top: 0;

  width: 52%;
  height: 100%;

  z-index: 10;

  background-color:
    #f58ab5;

  background-image:
    radial-gradient(
      circle,
      #dff38e 4px,
      transparent 5px
    );

  background-size:
    35px 35px;

  border-bottom:
    7px solid #ce5c8d;

  transition:
    transform
    1.15s
    cubic-bezier(.7,0,.3,1);

  box-shadow:
    inset 0 0 20px
    rgba(120,35,75,.25);
}


/* CURTAIN FOLDS */

.curtain::after {
  content: "";

  position: absolute;

  inset: 0;

  background:
    repeating-linear-gradient(
      90deg,
      transparent 0,
      transparent 22px,
      rgba(126,33,76,.16) 26px,
      transparent 40px
    );
}

.curtain-left {
  left: 0;

  border-right:
    3px solid #bd507c;
}

.curtain-right {
  right: 0;

  border-left:
    3px solid #bd507c;
}


/* OPEN */

.booth-window.open
.curtain-left {
  transform:
    translateX(-92%);
}

.booth-window.open
.curtain-right {
  transform:
    translateX(92%);
}


/* TOP VALANCE */

.valance {
  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 42px;

  z-index: 20;

  background:
    repeating-linear-gradient(
      90deg,
      #fff5a8 0,
      #fff5a8 38px,
      #a9dff7 39px,
      #a9dff7 43px
    );

  border-bottom:
    4px solid #8ccbea;

  clip-path:
    polygon(
      0 0,
      100% 0,
      100% 65%,
      94% 100%,
      88% 65%,
      82% 100%,
      76% 65%,
      70% 100%,
      64% 65%,
      58% 100%,
      52% 65%,
      46% 100%,
      40% 65%,
      34% 100%,
      28% 65%,
      22% 100%,
      16% 65%,
      10% 100%,
      4% 65%,
      0 100%
    );
}


/* FLASH */

.flash {
  position: absolute;

  inset: 0;

  z-index: 40;

  background:
    white;

  opacity: 0;

  pointer-events: none;
}

.flash.go {
  animation:
    cameraFlash
    .35s ease;
}

@keyframes cameraFlash {

  0% {
    opacity: 0;
  }

  20% {
    opacity: 1;
  }

  100% {
    opacity: 0;
  }

}


/* CONTROL PANEL */

.control-panel {
  padding: 11px;

  background:
    #ffacd0;

  border:
    4px double #90ddeb;

  border-radius: 13px;

  box-shadow:
    inset 0 0 0
    3px #fff5ba;
}


button {
  margin: 4px;

  padding:
    8px
    15px;

  background:
    linear-gradient(
      #fffdf7,
      #ffe9f3
    );

  border:
    3px double #80d7e2;

  border-radius: 10px;

  font-family:
    "Sour Gummy",
    sans-serif;

  font-size: 15px;

  font-weight: bold;

  color:
    #a65e83;

  box-shadow:
    2px 3px 0
    rgba(255,255,255,.5);

  cursor:
    url('https://cdn.cursors-4u.net/previews/puppy-13-a9c1ade9-32.webp')
    32 32,
    auto !important;

  transition:
    transform .15s ease,
    background .15s ease;
}

button:hover {
  transform:
    scale(1.06);

  background:
    #fff9bd;
}

button:disabled {
  opacity: .45;

  cursor:
    url('https://cdn.cursors-4u.net/previews/puppy-13-a9c1ade9-32.webp')
    32 32,
    auto !important;

  transform:
    none;
}

.counter {
  margin-top: 7px;

  font-size: 13px;

  color:
    #905f79;
}


/* PRINTER AREA */

.photo-printer {
  position: relative;

  width: 230px;

  height: 185px;

  margin:
    18px
    auto
    -10px;

  overflow: visible;
}

.printer-label {
  margin-bottom: 4px;

  font-family:
    "Unkempt",
    cursive;

  font-size: 14px;

  color:
    #9b607e;
}


/* PRINTER SLIT */

.printer-slit {
  position: relative;

  width: 180px;
  height: 20px;

  margin:
    0 auto;

  background:
    #5e404b;

  border:
    4px solid #fff3b8;

  border-radius: 20px;

  box-shadow:
    inset 0 3px 5px
    rgba(0,0,0,.45),
    0 2px 0
    #da83a8;

  z-index: 10;

  overflow: visible;
}


/*
FRONT EDGE OF SLOT

this sits ABOVE the strip so the
paper looks like it is actually
coming from inside the slot
*/

.printer-slit::after {
  content: "";

  position: absolute;

  left: -4px;
  top: -4px;

  width: 180px;
  height: 20px;

  background:
    #5e404b;

  border:
    4px solid #fff3b8;

  border-radius: 20px;

  box-shadow:
    inset 0 3px 5px
    rgba(0,0,0,.45),
    0 2px 0
    #da83a8;

  z-index: 30;

  pointer-events: none;
}


/* MINI STRIP */

.mini-strip {
  position: absolute;

  width: 65px;

  left: 50%;
  top: 8px;

  transform:
    translateX(-50%)
    translateY(0px);

  padding:
    5px
    5px
    9px;

  background:
    #fffdf5;

  border:
    2px solid
    #c9a89d;

  box-shadow:
    3px 4px 4px
    rgba(70,40,50,.2);

  transition:
    transform
    2.3s
    cubic-bezier(.18,.75,.25,1);

  z-index: 20;
}


/*
STRIP SITS DIRECTLY
IN THE SLOT
*/

.mini-strip.waiting {
  transform:
    translateX(-50%)
    translateY(0px);
}


/*
STRIP PRINTS DOWNWARD
OUT OF THE SLOT
*/

.mini-strip.printing {
  transform:
    translateX(-50%)
    translateY(72px);
}


.mini-photo {
  width: 51px;
  height: 34px;

  margin-bottom: 4px;

  overflow: hidden;

  background:
    linear-gradient(
      135deg,
      #ffd4e4,
      #dff49d,
      #b9e8ff
    );

  border:
    1px solid
    #ead5d9;
}

.mini-photo img {
  width: 100%;
  height: 100%;

  object-fit: cover;
}

.mini-strip-footer {
  font-size: 6px;

  color:
    #d3709b;

  line-height: 1;
}


/* FINISHED STRIP AREA */

.result-area {
  display: none;

  width: 260px;

  margin:
    90px
    auto
    25px;

  padding:
    15px
    14px
    22px;

  background:
    #fff9e5;

  border:
    3px solid
    #795748;

  box-shadow:
    6px 7px 0
    rgba(255,132,180,.25);

  transform:
    rotate(1deg);
}

.result-area h2 {
  margin:
    0
    0
    10px;

  font-family:
    "Bonbon",
    cursive;

  color:
    #ff74ae;
}


/* LARGE STRIP */

.large-strip {
  padding:
    10px
    10px
    14px;

  background:
    #fffdf6;
}

.strip-photo {
  display: block;

  width: 100%;

  margin-bottom: 8px;

  border:
    4px solid white;

  box-shadow:
    0 1px 3px
    rgba(0,0,0,.15);
}

.strip-footer {
  margin-top: 8px;

  font-family:
    "Unkempt",
    cursive;

  color:
    #9b6780;

  font-size: 15px;
}


/* SAVE SECTION */

.save-area {
  display: none;

  width: 390px;

  margin:
    25px auto;

  padding: 16px;

  background:
    rgba(255,255,255,.87);

  border:
    4px double
    #ffabc8;

  border-radius: 15px;

  box-shadow:
    4px 4px 0
    rgba(157,224,232,.3);
}

.save-area h3 {
  margin:
    0 0
    8px;

  font-family:
    "Unkempt",
    cursive;

  color:
    #ff70a8;
}

.consent-row {
  display: flex;

  align-items: flex-start;

  gap: 8px;

  margin:
    12px
    auto;

  text-align: left;

  font-size: 13px;

  line-height: 1.35;
}

.consent-row input {
  margin-top: 3px;
}

#saveStatus {
  min-height: 20px;

  margin-top: 8px;

  font-size: 13px;

  color:
    #a26988;
}


/* CANVAS */

canvas {
  display: none;
}


/* MOBILE */

@media
(max-width: 560px) {

  body {
    padding-left: 5px;
    padding-right: 5px;
  }

  .photobooth {
    width: 95%;
  }

  .booth-window {
    width: 90%;
  }

  .booth-sign {
    width: 78%;
    font-size: 30px;
  }

  .save-area {
    width: 90%;
  }

}

</style>
</head>


<body>


<h1>
  step into my photobooth ♡
</h1>


<div class="intro">
  step inside...
  smile...
  don't blink!!
  (˶ᵔ ᵕ ᵔ˶)
</div>


<div class="photobooth">


  <div class="booth-sign">
    PHOTOBOOTH
  </div>


  <div
    class="booth-window"
    id="boothWindow"
  >


    <div class="star s1">
      ★
    </div>

    <div class="star s2">
      ★
    </div>

    <div class="star s3">
      ★
    </div>

    <div class="star s4">
      ★
    </div>

    <div class="star s5">
      ★
    </div>


    <video
      id="camera"
      autoplay
      playsinline
    ></video>


    <div
      class="camera-placeholder"
      id="placeholder"
    >

      <div class="heart">
        ♡
      </div>

      <b>
        the booth is closed...
      </b>

      <span>
        click “enter booth”
        to open the curtain!
      </span>

    </div>


    <div
      class="curtain curtain-left"
    ></div>


    <div
      class="curtain curtain-right"
    ></div>


    <div
      class="valance"
    ></div>


    <div
      class="flash"
      id="flash"
    ></div>

  </div>


  <div class="control-panel">

    <button
      id="enterButton"
      onclick="enterBooth()"
    >
      ♡ enter booth
    </button>


    <button
      id="snapButton"
      onclick="takePhoto()"
      disabled
    >
      📷 take photo
    </button>


    <button
      onclick="resetBooth()"
    >
      ↻ restart
    </button>


    <div
      class="counter"
      id="counter"
    >
      photos taken:
      0 / 4
    </div>

  </div>


  <!-- LITTLE PRINTER -->

  <div class="photo-printer">

    <div class="printer-label">
      your photos ♡
    </div>


    <div class="printer-slit">


      <div
        id="miniStrip"
        class="mini-strip waiting"
      >

        <div
          class="mini-photo"
          id="miniPhoto1"
        ></div>

        <div
          class="mini-photo"
          id="miniPhoto2"
        ></div>

        <div
          class="mini-photo"
          id="miniPhoto3"
        ></div>

        <div
          class="mini-photo"
          id="miniPhoto4"
        ></div>


        <div class="mini-strip-footer">
          mina's booth ♡
        </div>

      </div>

    </div>

  </div>

</div>


<!-- FINISHED STRIP -->

<div
  class="result-area"
  id="resultArea"
>

  <h2>
    your photos ♡
  </h2>


  <div
    class="large-strip"
    id="photoStrip"
  ></div>


  <div class="strip-footer">
    mina's internet corner ★
  </div>

</div>


<!-- SAVE OPTIONS -->

<div
  class="save-area"
  id="saveArea"
>

  <h3>
    keep your strip ♡
  </h3>


  <button
    onclick="downloadStrip()"
  >
    ↓ save strip to device
  </button>


  <div class="consent-row">

    <input
      type="checkbox"
      id="sendConsent"
    >

    <label
      for="sendConsent"
    >
      send a private copy
      of this photo strip
      to mina's photobooth
      archive ♡
    </label>

  </div>


  <button
    id="sendButton"
    onclick="sendToMina()"
    disabled
  >
    ♡ send to mina
  </button>


  <div
    id="saveStatus"
  ></div>

</div>


<canvas
  id="cameraCanvas"
  width="600"
  height="450"
></canvas>


<canvas
  id="stripCanvas"
  width="650"
  height="2050"
></canvas>


<script>

/*
=========================================
PRIVATE ARCHIVE SETTINGS
=========================================

DO NOT use a Supabase service-role key here.

When we connect your archive later,
put ONLY your public anon key here.

*/

const SUPABASE_URL =
  "";

const SUPABASE_ANON_KEY =
  "";

const STORAGE_BUCKET =
  "photobooth-private";


/*
=========================================
ELEMENTS
=========================================
*/

const video =
  document.getElementById(
    "camera"
  );

const cameraCanvas =
  document.getElementById(
    "cameraCanvas"
  );

const cameraContext =
  cameraCanvas.getContext(
    "2d"
  );

const stripCanvas =
  document.getElementById(
    "stripCanvas"
  );

const stripContext =
  stripCanvas.getContext(
    "2d"
  );

const windowBox =
  document.getElementById(
    "boothWindow"
  );

const placeholder =
  document.getElementById(
    "placeholder"
  );

const snapButton =
  document.getElementById(
    "snapButton"
  );

const counter =
  document.getElementById(
    "counter"
  );

const photoStrip =
  document.getElementById(
    "photoStrip"
  );

const resultArea =
  document.getElementById(
    "resultArea"
  );

const saveArea =
  document.getElementById(
    "saveArea"
  );

const flash =
  document.getElementById(
    "flash"
  );

const miniStrip =
  document.getElementById(
    "miniStrip"
  );

const sendConsent =
  document.getElementById(
    "sendConsent"
  );

const sendButton =
  document.getElementById(
    "sendButton"
  );

const saveStatus =
  document.getElementById(
    "saveStatus"
  );


let stream;

let photosTaken =
  0;

const maximumPhotos =
  4;

let photos =
  [];


/*
=========================================
ENTER BOOTH
=========================================
*/

async function enterBooth() {

  windowBox.classList.add(
    "open"
  );


  try {

    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {
            facingMode:
              "user"
          },

          audio:
            false

        });


    video.srcObject =
      stream;


    video.style.display =
      "block";


    placeholder.style.display =
      "none";


    snapButton.disabled =
      false;

  }


  catch(error) {

    console.error(
      error
    );


    placeholder.innerHTML =
      `
      <div class="heart">
        :(
      </div>

      <b>
        camera permission
        was blocked!
      </b>

      <span>
        allow camera access
        and reload the page ♡
      </span>
      `;

  }

}


/*
=========================================
TAKE PHOTO
=========================================
*/

function takePhoto() {

  if (
    photosTaken >=
    maximumPhotos
  ) {

    return;

  }


  flash.classList.remove(
    "go"
  );


  void flash.offsetWidth;


  flash.classList.add(
    "go"
  );


  /*
  mirror the webcam image
  */

  cameraContext.save();


  cameraContext.translate(
    cameraCanvas.width,
    0
  );


  cameraContext.scale(
    -1,
    1
  );


  cameraContext.drawImage(
    video,
    0,
    0,
    cameraCanvas.width,
    cameraCanvas.height
  );


  cameraContext.restore();


  const photoData =
    cameraCanvas.toDataURL(
      "image/jpeg",
      .92
    );


  photos.push(
    photoData
  );


  photosTaken++;


  /*
  add photo to tiny
  printer strip
  */

  const miniBox =
    document.getElementById(
      "miniPhoto" +
      photosTaken
    );


  const miniImage =
    document.createElement(
      "img"
    );


  miniImage.src =
    photoData;


  miniBox.innerHTML =
    "";


  miniBox.appendChild(
    miniImage
  );


  /*
  add to large strip
  */

  const largeImage =
    document.createElement(
      "img"
    );


  largeImage.src =
    photoData;


  largeImage.className =
    "strip-photo";


  photoStrip.appendChild(
    largeImage
  );


  counter.textContent =
    "photos taken: " +
    photosTaken +
    " / " +
    maximumPhotos;


  /*
  finished!
  */

  if (
    photosTaken ===
    maximumPhotos
  ) {

    finishStrip();

  }

}


/*
=========================================
FINISH STRIP
=========================================
*/

function finishStrip() {

  snapButton.disabled =
    true;


  /*
  strip slides out
  */

  miniStrip.classList.remove(
    "waiting"
  );


  setTimeout(
    function() {

      miniStrip.classList.add(
        "printing"
      );

    },

    250
  );


  /*
  build downloadable
  combined strip
  */

  buildStripCanvas();


  /*
  reveal result
  */

  setTimeout(
    function() {

      resultArea.style.display =
        "block";


      saveArea.style.display =
        "block";

    },

    1900
  );

}


/*
=========================================
BUILD COMBINED STRIP
=========================================
*/

function buildStripCanvas() {

  stripContext.fillStyle =
    "#fffdf6";


  stripContext.fillRect(
    0,
    0,
    stripCanvas.width,
    stripCanvas.height
  );


  /*
  title
  */

  stripContext.fillStyle =
    "#e36f9f";


  stripContext.textAlign =
    "center";


  stripContext.font =
    "bold 42px Arial";


  stripContext.fillText(
    "mina's photobooth ♡",
    stripCanvas.width / 2,
    55
  );


  /*
  draw each picture
  */

  photos.forEach(
    function(photo, index) {

      const image =
        new Image();


      image.onload =
        function() {


          const y =
            90 +
            index * 465;


          stripContext.drawImage(
            image,
            40,
            y,
            570,
            425
          );


          /*
          footer after last
          image loads
          */

          if (
            index ===
            photos.length - 1
          ) {

            stripContext.fillStyle =
              "#b66f91";


            stripContext.font =
              "28px Arial";


            stripContext.fillText(
              "mina's internet corner ★",
              stripCanvas.width / 2,
              2000
            );

          }

        };


      image.src =
        photo;

    }
  );

}


/*
=========================================
DOWNLOAD STRIP
=========================================
*/

function downloadStrip() {

  const link =
    document.createElement(
      "a"
    );


  link.download =
    "mina-photobooth-strip.jpg";


  link.href =
    stripCanvas.toDataURL(
      "image/jpeg",
      .94
    );


  link.click();

}


/*
=========================================
CONSENT
=========================================
*/

sendConsent.addEventListener(
  "change",
  function() {

    sendButton.disabled =
      !this.checked;

  }
);


/*
=========================================
SEND PRIVATE COPY
=========================================
*/

async function sendToMina() {

  if (
    !sendConsent.checked
  ) {

    return;

  }


  /*
  backend not connected yet
  */

  if (
    !SUPABASE_URL ||
    !SUPABASE_ANON_KEY
  ) {

    saveStatus.textContent =
      "private archive isn't connected yet ♡";

    return;

  }


  sendButton.disabled =
    true;


  saveStatus.textContent =
    "sending your strip... ♡";


  try {


    const blob =
      await new Promise(
        function(resolve) {

          stripCanvas.toBlob(
            resolve,
            "image/jpeg",
            .94
          );

        }
      );


    const randomPart =
      Math.random()
        .toString(36)
        .slice(2,10);


    const filename =
      Date.now() +
      "-" +
      randomPart +
      ".jpg";


    const uploadURL =
      SUPABASE_URL +
      "/storage/v1/object/" +
      STORAGE_BUCKET +
      "/" +
      filename;


    const response =
      await fetch(
        uploadURL,
        {

          method:
            "POST",

          headers: {

            "Authorization":
              "Bearer " +
              SUPABASE_ANON_KEY,

            "apikey":
              SUPABASE_ANON_KEY,

            "Content-Type":
              "image/jpeg",

            "x-upsert":
              "false"

          },

          body:
            blob

        }
      );


    if (
      !response.ok
    ) {

      const errorText =
        await response.text();


      throw new Error(
        errorText
      );

    }


    saveStatus.textContent =
      "sent privately to mina ♡";


    sendButton.textContent =
      "sent ♡";


    sendButton.disabled =
      true;


    sendConsent.disabled =
      true;

  }


  catch(error) {

    console.error(
      error
    );


    saveStatus.textContent =
      "couldn't send it :( try again";


    sendButton.disabled =
      false;

  }

}


/*
=========================================
RESET
=========================================
*/

function resetBooth() {

  photosTaken =
    0;


  photos =
    [];


  counter.textContent =
    "photos taken: 0 / 4";


  photoStrip.innerHTML =
    "";


  resultArea.style.display =
    "none";


  saveArea.style.display =
    "none";


  snapButton.disabled =
    true;


  video.style.display =
    "none";


  placeholder.style.display =
    "flex";


  placeholder.innerHTML =
    `
    <div class="heart">
      ♡
    </div>

    <b>
      the booth is closed...
    </b>

    <span>
      click “enter booth”
      to open the curtain!
    </span>
    `;


  windowBox.classList.remove(
    "open"
  );


  miniStrip.classList.remove(
    "printing"
  );


  miniStrip.classList.add(
    "waiting"
  );


  for (
    let i = 1;
    i <= 4;
    i++
  ) {

    document
      .getElementById(
        "miniPhoto" + i
      )
      .innerHTML =
        "";

  }


  sendConsent.checked =
    false;


  sendConsent.disabled =
    false;


  sendButton.disabled =
    true;


  sendButton.textContent =
    "♡ send to mina";


  saveStatus.textContent =
    "";


  if (stream) {

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

  }


  stream =
    null;

}
