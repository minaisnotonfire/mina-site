<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mina's photobooth</title>

  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Unkempt:wght@400;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Fredoka", sans-serif;
      background: transparent;
      color: #8b5e78;
    }

    .photobooth-wrap {
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      padding: 18px 18px 28px;
      border: 3px solid #85ddff;
      border-radius: 20px;
      background:
        repeating-linear-gradient(
          0deg,
          #efc9d6 0px,
          #efc9d6 22px,
          #f5d7e1 22px,
          #f5d7e1 44px
        );
      box-shadow:
        0 0 0 3px #ffc3db inset,
        0 0 0 6px #fff6b4 inset;
      position: relative;
      overflow: hidden;
    }

    .photobooth-wrap::before,
    .photobooth-wrap::after {
      content: "☆";
      position: absolute;
      color: #ffd8ec;
      font-size: 22px;
      opacity: 0.9;
    }

    .photobooth-wrap::before {
      left: 18px;
      top: 18px;
    }

    .photobooth-wrap::after {
      right: 18px;
      top: 18px;
      color: #b8f3ff;
    }

    .intro {
      text-align: center;
      margin: 8px 0 14px;
      font-family: "Unkempt", cursive;
      font-size: 20px;
      color: #8f6280;
    }

    .booth {
      width: 100%;
      max-width: 470px;
      margin: 0 auto;
      background: #f8efcb;
      border: 6px solid #785745;
      border-radius: 18px 18px 30px 30px;
      box-shadow: 10px 10px 0 rgba(169, 118, 146, 0.18);
      padding: 20px 18px 24px;
      position: relative;
    }

    .booth-sign {
      width: 85%;
      margin: -64px auto 10px;
      background: #f4e8b8;
      border: 5px solid #7f5a47;
      border-radius: 10px;
      text-align: center;
      font-family: "Unkempt", cursive;
      font-size: 34px;
      font-weight: 700;
      color: #7f523c;
      padding: 10px 10px 6px;
      box-shadow: 6px 6px 0 #e58cb0;
    }

    .screen-frame {
      background: #f3a3c7;
      border: 5px solid #754f3f;
      border-radius: 10px;
      padding: 12px;
      width: 100%;
      max-width: 380px;
      margin: 14px auto 10px;
      position: relative;
    }

    .screen-curtains {
      width: 100%;
      height: 310px;
      border-radius: 8px;
      overflow: hidden;
      border: 4px solid #7e5d48;
      background:
        repeating-linear-gradient(
          90deg,
          #ef6bb1 0px,
          #ef6bb1 22px,
          #ffe999 22px,
          #ffe999 24px,
          #f58bc0 24px,
          #f58bc0 46px
        );
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .screen-curtains.open {
      background: #fdf7ff;
    }

    .screen-curtains.open::before,
    .screen-curtains.open::after {
      content: "";
      position: absolute;
      top: 0;
      width: 22%;
      height: 100%;
      background:
        repeating-linear-gradient(
          90deg,
          #ef6bb1 0px,
          #ef6bb1 22px,
          #ffe999 22px,
          #ffe999 24px,
          #f58bc0 24px,
          #f58bc0 46px
        );
      z-index: 2;
      transition: all 0.5s ease;
    }

    .screen-curtains.open::before {
      left: 0;
      border-right: 3px solid rgba(255,255,255,0.45);
    }

    .screen-curtains.open::after {
      right: 0;
      border-left: 3px solid rgba(255,255,255,0.45);
    }

    .video-wrap {
      width: 100%;
      max-width: 230px;
      height: 260px;
      background: #fffafc;
      border: 4px solid #89def9;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      z-index: 1;
      display: none;
    }

    .screen-curtains.open .video-wrap {
      display: block;
    }

    video, canvas.preview-canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scaleX(-1);
      background: #fff;
    }

    .placeholder-text {
      font-family: "Unkempt", cursive;
      color: #8b6481;
      font-size: 28px;
      text-align: center;
      line-height: 1.2;
      padding: 0 20px;
    }

    .controls {
      margin: 16px auto 0;
      width: 100%;
      max-width: 360px;
      background: #ec9fc2;
      border: 4px solid #ffe483;
      box-shadow: 0 0 0 3px #89ddff inset;
      border-radius: 16px;
      padding: 14px 12px 10px;
      text-align: center;
    }

    .button-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    button {
      border: 3px solid #8de4ff;
      background: #fff4f8;
      color: #985a7b;
      font-family: "Fredoka", sans-serif;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      padding: 8px 16px;
      cursor: pointer;
      box-shadow: 0 2px 0 #f1b7cc;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
      background: #fffafb;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .count {
      font-size: 15px;
      color: #8e5e7b;
      margin-top: 6px;
    }

    .printer-label {
      text-align: center;
      margin-top: 12px;
      margin-bottom: 6px;
      font-family: "Unkempt", cursive;
      font-size: 16px;
      color: #9b607e;
    }

    .photo-printer {
      position: relative;
      width: 240px;
      height: 195px;
      margin: 0 auto 0;
      overflow: visible;
    }

    .printer-slit {
      position: relative;
      width: 180px;
      height: 20px;
      margin: 0 auto;
      background: #5e404b;
      border: 4px solid #fff3b8;
      border-radius: 20px;
      box-shadow:
        inset 0 3px 5px rgba(0,0,0,.45),
        0 2px 0 #da83a8;
      z-index: 20;
      overflow: visible;
    }

    .mini-strip {
      position: absolute;
      width: 72px;
      left: 50%;
      top: 10px;
      transform: translateX(-50%) translateY(-8px);
      padding: 5px 5px 9px;
      background: #fffdf5;
      border: 2px solid #c9a89d;
      box-shadow: 3px 4px 4px rgba(70,40,50,.2);
      transition: transform 2.3s cubic-bezier(.18,.75,.25,1);
      z-index: 10;
    }

    .mini-strip.waiting {
      transform: translateX(-50%) translateY(-8px);
    }

    .mini-strip.printing {
      transform: translateX(-50%) translateY(72px);
    }

    .mini-slot-photo {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: linear-gradient(135deg, #f6f0b3, #d7f4ff, #f8d1ee);
      border: 1px solid #eadbcd;
      margin-bottom: 4px;
      overflow: hidden;
    }

    .mini-slot-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .mini-strip-footer {
      text-align: center;
      font-size: 8px;
      color: #dd8db0;
      font-family: "Fredoka", sans-serif;
      margin-top: 2px;
    }

    .flash {
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 3;
    }

    .flash.active {
      animation: flashbang 0.35s ease;
    }

    @keyframes flashbang {
      0% { opacity: 0; }
      30% { opacity: 0.95; }
      100% { opacity: 0; }
    }

    .hidden-canvas {
      display: none;
    }

    .strip-output {
      display: none;
      width: 78px;
      margin: 0 auto;
      background: #fffdf8;
      border: 2px solid #cbb1a4;
      padding: 6px;
      box-shadow: 4px 4px 0 rgba(160, 115, 142, 0.2);
    }

    .strip-output.show {
      display: block;
    }

    .strip-photo {
      width: 100%;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      margin-bottom: 6px;
      border: 1px solid #eadbcc;
      background: #faf7ef;
    }

    .strip-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .strip-footer {
      text-align: center;
      font-size: 9px;
      color: #e396b6;
      font-family: "Fredoka", sans-serif;
      margin-top: 3px;
    }

    @media (max-width: 600px) {
      .booth-sign {
        font-size: 28px;
      }

      .screen-curtains {
        height: 260px;
      }

      .video-wrap {
        max-width: 180px;
        height: 210px;
      }
    }
  </style>
</head>
<body>

  <div class="photobooth-wrap">
    <div class="intro">step inside... smile... don't blink!! (˶ᵔ ᵕ ᵔ˶)</div>

    <div class="booth">
      <div class="booth-sign">PHOTOBOOTH</div>

      <div class="screen-frame">
        <div class="screen-curtains" id="curtains">
          <div class="flash" id="flash"></div>

          <div class="video-wrap" id="videoWrap">
            <video id="video" autoplay playsinline muted></video>
          </div>

          <div class="placeholder-text" id="placeholderText">
            enter booth ♡
          </div>
        </div>
      </div>

      <div class="controls">
        <div class="button-row">
          <button id="enterBtn">♡ enter booth</button>
          <button id="snapBtn" disabled>📸 take photo</button>
          <button id="resetBtn">↻ restart</button>
        </div>

        <div class="count" id="countText">photos taken: 0 / 4</div>
      </div>

      <div class="printer-label">your photo strip ♡</div>

      <div class="photo-printer">
        <div class="printer-slit">
          <div class="mini-strip waiting" id="miniStrip">
            <div class="mini-slot-photo" id="mini1"></div>
            <div class="mini-slot-photo" id="mini2"></div>
            <div class="mini-slot-photo" id="mini3"></div>
            <div class="mini-slot-photo" id="mini4"></div>
            <div class="mini-strip-footer">mina's booth ♡</div>
          </div>
        </div>
      </div>

      <canvas id="captureCanvas" class="hidden-canvas"></canvas>
    </div>
  </div>

  <script>
    const video = document.getElementById("video");
    const captureCanvas = document.getElementById("captureCanvas");
    const enterBtn = document.getElementById("enterBtn");
    const snapBtn = document.getElementById("snapBtn");
    const resetBtn = document.getElementById("resetBtn");
    const countText = document.getElementById("countText");
    const curtains = document.getElementById("curtains");
    const placeholderText = document.getElementById("placeholderText");
    const flash = document.getElementById("flash");
    const miniStrip = document.getElementById("miniStrip");

    const miniBoxes = [
      document.getElementById("mini1"),
      document.getElementById("mini2"),
      document.getElementById("mini3"),
      document.getElementById("mini4")
    ];

    let stream = null;
    let captures = [];

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false
        });

        video.srcObject = stream;
        curtains.classList.add("open");
        placeholderText.style.display = "none";
        snapBtn.disabled = false;
      } catch (err) {
        placeholderText.innerHTML = "camera access denied :( <br> please allow camera";
      }
    }

    function flashEffect() {
      flash.classList.remove("active");
      void flash.offsetWidth;
      flash.classList.add("active");
    }

    function capturePhoto() {
      if (!stream || captures.length >= 4) return;

      const ctx = captureCanvas.getContext("2d");
      captureCanvas.width = video.videoWidth || 480;
      captureCanvas.height = video.videoHeight || 640;

      ctx.save();
      ctx.scale(-1, 1);
      ctx.drawImage(video, -captureCanvas.width, 0, captureCanvas.width, captureCanvas.height);
      ctx.restore();

      const imageData = captureCanvas.toDataURL("image/png");
      captures.push(imageData);
      updateStrip();
      flashEffect();

      countText.textContent = `photos taken: ${captures.length} / 4`;

      if (captures.length >= 4) {
        snapBtn.disabled = true;
        setTimeout(() => {
          miniStrip.classList.remove("waiting");
          miniStrip.classList.add("printing");
        }, 350);
      }
    }

    function updateStrip() {
      miniBoxes.forEach((box, index) => {
        box.innerHTML = "";
        if (captures[index]) {
          const img = document.createElement("img");
          img.src = captures[index];
          box.appendChild(img);
        }
      });
    }

    function resetBooth() {
      captures = [];
      updateStrip();
      countText.textContent = "photos taken: 0 / 4";
      miniStrip.classList.remove("printing");
      miniStrip.classList.add("waiting");
      if (stream) {
        snapBtn.disabled = false;
      }
    }

    enterBtn.addEventListener("click", startCamera);
    snapBtn.addEventListener("click", capturePhoto);
    resetBtn.addEventListener("click", resetBooth);
  </script>
</body>
</html>
