<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>home</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Bonbon&family=Sour+Gummy:wght@400;600;700&family=Unkempt:wght@400;700&display=swap" rel="stylesheet">

  <style>

    body {
      background: #fffdf4;
      font-family: Arial, sans-serif;
      padding: 20px;
      margin: 0;
      color: #222;
    }


    h1 {
      color: hotpink;

      font-family: "Sour Gummy", cursive;

      font-size: 32px;

      margin-bottom: 12px;
    }


    p {
      font-size: 16px;
      line-height: 1.25;
      margin: 10px 0;
    }



    /* ✧ RANDOM FACT GENERATOR ✧ */

    .fact-widget {
      width: 330px;

      margin: 70px auto 0;

      padding: 16px 16px 17px;

      position: relative;

      text-align: center;


      background:
        radial-gradient(
          circle,
          rgba(255,255,255,.9) 2px,
          transparent 2.5px
        );

      background-size: 18px 18px;

      background-color: #eef9ff;


      border: 3px double #ffa9c9;

      border-radius: 18px;


      outline: 2px dashed #aeeae6;

      outline-offset: -7px;


      box-shadow:
        4px 4px 0 rgba(181,239,233,.38),
        inset 0 0 13px rgba(255,192,203,.18);
    }



    /* little corner decorations */

    .fact-widget::before {
      content: "♡";

      position: absolute;

      left: 12px;
      top: 9px;

      font-family: "Sour Gummy", cursive;

      color: #ff8fbb;

      font-size: 15px;
    }


    .fact-widget::after {
      content: "☆";

      position: absolute;

      right: 12px;
      top: 9px;

      color: #8edbd7;

      font-size: 16px;
    }



    .fact-top-stars {
      margin-bottom: 4px;

      font-family: "Sour Gummy", cursive;

      font-size: 15px;

      letter-spacing: 6px;

      color: #ff82b4;
    }



    /* BUBBLY TITLE */

    .fact-title {
      display: inline-block;

      padding: 4px 13px 6px;

      margin-bottom: 6px;


      background:
        linear-gradient(
          #fffdf2,
          #fff2e8
        );


      border: 3px double #efb5bb;

      border-radius: 18px;


      font-family: "Bonbon", cursive;

      font-size: 24px;

      line-height: 1;


      color: #9c6557;


      text-shadow:
        1px 1px 0 #ffffff,
        0 0 2px rgba(255,255,255,.7);


      box-shadow:
        2px 3px 0 rgba(255,174,195,.25);


      transform: rotate(-1deg);
    }



    .fact-subtitle {
      margin: 3px 0 11px;

      font-family: "Sour Gummy", cursive;

      font-size: 11px;

      color: #c27598;
    }



    /* FACT DISPLAY */

    #fact-box {
      min-height: 48px;

      padding: 9px 12px;


      display: flex;

      align-items: center;

      justify-content: center;


      background:
        repeating-linear-gradient(
          0deg,
          #fffdf7,
          #fffdf7 20px,
          #e8f6f4 21px
        );


      border: 2px dashed #ff9fbe;

      border-radius: 9px;


      font-family: "Sour Gummy", cursive;

      font-size: 14px;

      color: #755d69;


      box-shadow:
        inset 0 0 7px rgba(255,198,216,.18);
    }



    /* BUTTON */

    .fact-button {
      margin-top: 11px;

      padding: 6px 13px;


      background:
        linear-gradient(
          #fffdf8,
          #ffeef5
        );


      border: 3px double #86dddf;

      border-radius: 10px;


      font-family: "Sour Gummy", cursive;

      font-size: 15px;

      font-weight: 700;


      color: #ad6484;


      box-shadow:
        2px 3px 0 rgba(255,185,207,.3);


      cursor: pointer;


      transition:
        transform .18s ease,
        background .18s ease;
    }



    .fact-button:hover {
      background:
        linear-gradient(
          #fff3f8,
          #ebffff
        );

      transform:
        translateY(-1px)
        rotate(-1deg)
        scale(1.04);
    }



    .fact-bottom {
      margin-top: 9px;

      font-family: "Sour Gummy", cursive;

      font-size: 11px;

      letter-spacing: 5px;

      color: #98dcd8;
    }



    .fact-pop {
      animation: factPop .3s ease;
    }


    @keyframes factPop {

      0% {
        opacity: 0;

        transform: scale(.94);
      }

      70% {
        transform: scale(1.03);
      }

      100% {
        opacity: 1;

        transform: scale(1);
      }

    }

  </style>

</head>


<body>


  <h1>
    haiiii ★
  </h1>


  <p>
    welcome to my website!
  </p>


  <p>
    this is my little corner of the internet for
    games, pictures, diary entries, friends,
    random interests and whatever else i feel like putting here.
  </p>



  <!-- RANDOM FACT -->

  <div class="fact-widget">


    <div class="fact-top-stars">
      ☆ ♡ ☆
    </div>


    <div class="fact-title">
      random fact abt me!
    </div>


    <div class="fact-subtitle">
      click to learn something random about mina ♡
    </div>


    <div id="fact-box">
      press the button!!
    </div>


    <button
      class="fact-button"
      onclick="generateFact()"
    >
      ✧ click to generate ✧
    </button>


    <div class="fact-bottom">
      ♡ ☆ ♡ ☆ ♡
    </div>


  </div>



  <script>

    const facts = [

      "i get a fortnite victory royale basically every time",

      "i volunteer a lot",

      "i love analyzing birth charts",

      "i am a sagittarius!",

      "i love roblox",

      "foo fighters and incubus are my favorite bands",

      "i love cats an unreasonable amount",

      "i'm obsessed with horror and weird lore",

      "i'm more of a pc gamer than a console gamer",

      "i love story-heavy games",

      "i can hyperfixate on something for hours",

      "i love bugs, especially beetles and ants",

      "i'm a huge fnaf fan",

      "i love sci-fi and star wars",

      "i'm really into psychology",

      "i love cute things and creepy things equally",

      "i take way too many pictures of my cat",

      "i will absolutely judge a fictional character by their birth chart",

      "i play fortnite like rent is due",

      "i love horror games but would probably die instantly in one",

      "i will defend my favorite game like i worked on it",

      "i take personality tests like they are legally binding",

      "i love horror until i actually hear a noise in my house",

      "i love lore more than i love understanding the actual plot",

      "i will open roblox for five minutes and disappear for three hours"

    ];



    let lastFact = -1;



    function generateFact() {

      let randomIndex;


      do {

        randomIndex =
          Math.floor(
            Math.random() * facts.length
          );

      }

      while (
        randomIndex === lastFact &&
        facts.length > 1
      );


      lastFact = randomIndex;


      const factBox =
        document.getElementById("fact-box");


      factBox.classList.remove("fact-pop");


      void factBox.offsetWidth;


      factBox.textContent =
        facts[randomIndex];


      factBox.classList.add("fact-pop");

    }

  </script>


</body>
</html>

</body>
</html>
