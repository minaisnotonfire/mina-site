<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>home ♡</title>


  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Bonbon&family=Sour+Gummy:wght@400;700&family=Unkempt:wght@400;700&display=swap"
    rel="stylesheet"
  >


  <style>


    /* =====================================
       PUPPY CURSOR
       ===================================== */

    * {
      box-sizing: border-box;

      cursor:
        url('https://cdn.cursors-4u.net/previews/puppy-13-a9c1ade9-32.webp')
        32 32,
        auto !important;
    }

    a,
    button,
    input {
      cursor:
        url('https://cdn.cursors-4u.net/previews/puppy-13-a9c1ade9-32.webp')
        32 32,
        auto !important;
    }



    /* =====================================
       PAGE
       ===================================== */

    html,
    body {
      min-height: 100%;
    }


    body {
      margin: 0;

      padding:
        28px
        26px
        45px;

      background:
        linear-gradient(
          rgba(255,255,255,.82),
          rgba(255,252,242,.82)
        ),
        url("https://fries-and-ice-cream.neocities.org/newcutestuff/bluepolkarose.gif");

      background-repeat: repeat;

      font-family:
        "Sour Gummy",
        sans-serif;

      color:
        #765f6d;

      text-align:
        center;
    }



    /* =====================================
       WELCOME
       ===================================== */

    .welcome-title {
      margin:
        6px
        0
        5px;

      font-family:
        "Bonbon",
        cursive;

      font-size:
        42px;

      line-height:
        1;

      color:
        #ff70aa;

      text-shadow:
        1px 1px 0 white,
        2px 2px 0 #f8c4d4;
    }


    .welcome-stars {
      margin-bottom:
        8px;

      font-size:
        17px;

      color:
        #a7dfe8;
    }


    .welcome-text {
      width:
        88%;

      max-width:
        460px;

      margin:
        0 auto;

      font-family:
        "Unkempt",
        cursive;

      font-size:
        17px;

      line-height:
        1.4;

      color:
        #8b6675;
    }



    /* =====================================
       LITTLE DIVIDER
       ===================================== */

    .divider {
      margin:
        24px
        auto
        10px;

      font-size:
        17px;

      letter-spacing:
        4px;

      color:
        #f4a9c5;
    }



    /* =====================================
       RANDOM FACT GENERATOR
       ===================================== */

    .fact-generator {
      position:
        relative;

      width:
        335px;

      max-width:
        92%;

      margin:
        45px
        auto
        0;

      padding:
        21px
        18px
        18px;

      background:
        linear-gradient(
          rgba(255,255,255,.86),
          rgba(255,252,230,.90)
        ),
        radial-gradient(
          circle,
          #bcecf2 3px,
          transparent 4px
        );

      background-size:
        auto,
        19px 19px;

      border:
        4px double
        #ffb0c9;

      border-radius:
        22px;

      box-shadow:
        5px 5px 0
        rgba(155,222,231,.27);
    }


    .fact-generator::before {
      content:
        "☆ ♡ ☆";

      position:
        absolute;

      top:
        -17px;

      left:
        50%;

      transform:
        translateX(-50%);

      padding:
        1px
        10px;

      background:
        #fffbed;

      border:
        2px solid
        #ffbad0;

      border-radius:
        13px;

      font-size:
        14px;

      color:
        #8edce7;

      white-space:
        nowrap;
    }


    .fact-title {
      display:
        inline-block;

      margin-bottom:
        7px;

      padding:
        4px
        13px;

      background:
        linear-gradient(
          #fffdf0,
          #fff3b9
        );

      border:
        3px double
        #ffb0c9;

      border-radius:
        17px;

      font-family:
        "Bonbon",
        cursive;

      font-size:
        28px;

      line-height:
        1;

      color:
        #ff70aa;

      text-shadow:
        1px 1px 0 white;
    }


    .fact-subtitle {
      margin:
        2px
        0
        13px;

      font-family:
        "Unkempt",
        cursive;

      font-size:
        14px;

      color:
        #866576;
    }


    #factDisplay {
      min-height:
        68px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      padding:
        12px;

      margin:
        0
        auto
        13px;

      background:
        rgba(255,255,255,.88);

      border:
        2px dashed
        #a9dee8;

      border-radius:
        13px;

      font-family:
        "Unkempt",
        cursive;

      font-size:
        16px;

      line-height:
        1.35;

      color:
        #765d6b;
    }


    #factButton {
      padding:
        8px
        15px;

      background:
        linear-gradient(
          #fffdf5,
          #ffe7f0
        );

      border:
        3px double
        #a8dfe7;

      border-radius:
        12px;

      font-family:
        "Sour Gummy",
        sans-serif;

      font-size:
        14px;

      font-weight:
        bold;

      color:
        #a55f82;

      box-shadow:
        2px 2px 0
        rgba(255,183,207,.22);

      transition:
        transform .15s ease,
        background .15s ease;
    }


    #factButton:hover {
      transform:
        scale(1.05);

      background:
        #fff3bd;
    }


    .fact-bottom {
      margin-top:
        10px;

      font-size:
        14px;

      letter-spacing:
        3px;

      color:
        #f2a7c3;
    }



    /* =====================================
       SCROLLBAR
       ===================================== */

    html,
    body {
      scrollbar-width:
        thin;

      scrollbar-color:
        #9edee8
        #eefcff;
    }


    ::-webkit-scrollbar {
      width:
        10px;
    }


    ::-webkit-scrollbar-track {
      background:
        #eefcff;
    }


    ::-webkit-scrollbar-thumb {
      background:
        linear-gradient(
          #bcebf1,
          #8fd8e3
        );

      border:
        2px solid
        #eefcff;

      border-radius:
        20px;
    }


    ::-webkit-scrollbar-thumb:hover {
      background:
        linear-gradient(
          #a9e3eb,
          #79ccd8
        );
    }



  </style>

</head>



<body>


  <div class="welcome-stars">
    ☆ ♡ ☆
  </div>


  <div class="welcome-title">
    haiii!! ♡
  </div>


  <div class="welcome-text">

    welcome to my little internet corner :3

    <br><br>

    this is basically my digital scrapbook for
    pictures, random things i like, games,
    memories, and whatever i'm obsessed with
    at the moment ♡

  </div>


  <div class="divider">
    ♡ ☆ ♡
  </div>



  <!-- RANDOM FACT GENERATOR -->

  <div class="fact-generator">


    <div class="fact-title">
      random fact abt me!
    </div>


    <div class="fact-subtitle">
      click to learn something random about mina ♡
    </div>


    <div id="factDisplay">
      press the button!!
    </div>


    <button
      id="factButton"
      type="button"
    >
      ✧ click to generate ✧
    </button>


    <div class="fact-bottom">
      ♡ ☆ ♡ ☆ ♡
    </div>


  </div>



<script>


const minaFacts = [

  "i get a fortnite victory royale each time",

  "i volunteer a lot ♡",

  "i love analyzing people's birth charts for fun",

  "i am a sagittarius! ☆",

  "i love roblox",

  "foo fighters and incubus r my fav bands",

  "i can hyperfixate on something for like 6 hours straight",

  "i love horror games and weird lore",

  "i take an unreasonable amount of pictures of my cat",

  "i will absolutely assign a birth chart to a fictional character",

  "i'm more of a pc gamer than a console gamer",

  "i love fnaf, resident evil, life is strange, silent hill and a million other games",

  "i love bugs but moths scare me",

  "i can spend forever making tiny things for my website"

];


const factDisplay =
  document.getElementById(
    "factDisplay"
  );


const factButton =
  document.getElementById(
    "factButton"
  );


let lastFact =
  -1;


factButton.addEventListener(
  "click",
  function() {


    let randomFact =
      Math.floor(
        Math.random() *
        minaFacts.length
      );


    while (
      randomFact === lastFact &&
      minaFacts.length > 1
    ) {

      randomFact =
        Math.floor(
          Math.random() *
          minaFacts.length
        );

    }


    lastFact =
      randomFact;


    factDisplay.textContent =
      minaFacts[randomFact];


  }
);


</script>


</body>

</html>
