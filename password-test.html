<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>friends only! ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Bonbon&family=Sour+Gummy:wght@400;700&family=Unkempt:wght@400;700&display=swap" rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;

      cursor:
        url('https://cdn.cursors-4u.net/previews/puppy-13-a9c1ade9-32.webp')
        32 32,
        auto !important;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 35px 15px;

      background-image:
        url("https://valentines.neocities.org/index/pink.png");

      background-repeat: repeat;
      background-position: center;

      font-family:
        "Sour Gummy",
        sans-serif;

      color: #76596a;
    }


    body::before {
      content: "";

      position: fixed;
      inset: 0;

      background:
        rgba(255,245,249,.14);

      pointer-events: none;
    }


    /* WRAPPER FOR DS + HINT */

    .gate-layout {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 24px;

      z-index: 2;
    }


    /* WHOLE 3DS */

    .ds {
      position: relative;

      width: 560px;
      max-width: 95vw;

      flex-shrink: 0;

      filter:
        drop-shadow(
          10px 13px 8px
          rgba(111,71,89,.22)
        );
    }


    /* TOP HALF */

    .ds-top {
      position: relative;

      width: 100%;

      padding:
        22px
        31px
        27px;

      background:
        linear-gradient(
          #ffd7e8,
          #efabc8
        );

      border:
        5px solid
        #b97996;

      border-radius:
        34px
        34px
        12px
        12px;

      box-shadow:
        inset 0 0 0
        4px
        rgba(255,255,255,.23);
    }


    /* CAMERA */

    .camera-row {
      height: 23px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 8px;
    }

    .camera-dot {
      width: 14px;
      height: 14px;

      border-radius: 50%;

      background:
        #684d5c;

      border:
        3px solid
        #f9dbea;

      box-shadow:
        inset 0 0 0
        2px #382f35;
    }

    .camera-light {
      width: 5px;
      height: 5px;

      border-radius: 50%;

      background:
        #fff6c6;
    }


    /* TOP SCREEN BEZEL */

    .top-bezel {
      position: relative;

      width: 100%;

      padding:
        14px
        30px;

      background:
        #735766;

      border:
        4px solid
        #5a414d;

      border-radius:
        13px;

      box-shadow:
        inset 0 0 0
        3px #9b7788;
    }


    /* TOP SCREEN */

    .top-screen {
      width: 100%;
      height: 230px;

      overflow: hidden;

      background:
        #fff;

      border:
        3px solid
        #332c30;

      border-radius: 5px;

      box-shadow:
        inset 0 0 10px
        rgba(0,0,0,.22);
    }

    .tomodachi-preview {
      display: block;

      width: 100%;
      height: 100%;

      border: 0;

      pointer-events: none;
    }


    /* SPEAKERS */

    .speaker-left,
    .speaker-right {
      position: absolute;

      top: 50%;

      width: 10px;
      height: 70px;

      transform:
        translateY(-50%);

      background:
        radial-gradient(
          circle,
          #a8758d 2px,
          transparent 3px
        );

      background-size:
        8px 10px;
    }

    .speaker-left {
      left: 8px;
    }

    .speaker-right {
      right: 8px;
    }


    /* HINGE */

    .hinge-area {
      position: relative;

      height: 25px;

      margin:
        -2px
        0;

      z-index: 3;
    }

    .hinge {
      position: absolute;

      left: 50%;
      top: 0;

      transform:
        translateX(-50%);

      width: 180px;
      height: 25px;

      background:
        linear-gradient(
          #ca8ca8,
          #a96e89
        );

      border:
        4px solid
        #8b5f73;

      border-radius:
        13px;

      box-shadow:
        inset 0 3px 3px
        rgba(255,255,255,.23);
    }


    /* BOTTOM HALF */

    .ds-bottom {
      position: relative;

      width: 100%;

      min-height: 375px;

      padding:
        28px
        31px
        35px;

      background:
        linear-gradient(
          #efabc8,
          #ffd7e8
        );

      border:
        5px solid
        #b97996;

      border-radius:
        12px
        12px
        38px
        38px;

      box-shadow:
        inset 0 0 0
        4px
        rgba(255,255,255,.23);
    }


    /* BOTTOM SCREEN BEZEL */

    .bottom-bezel {
      width: 330px;
      max-width: 85%;

      margin:
        0 auto;

      padding:
        12px;

      background:
        #735766;

      border:
        4px solid
        #5a414d;

      border-radius:
        13px;

      box-shadow:
        inset 0 0 0
        3px #9b7788;
    }


    /* BOTTOM SCREEN */

    .bottom-screen {
      min-height: 255px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding:
        18px
        15px;

      background:
        linear-gradient(
          rgba(255,255,255,.87),
          rgba(255,248,235,.89)
        ),
        url("https://fries-and-ice-cream.neocities.org/newcutestuff/bluepolkarose.gif");

      border:
        3px solid
        #332c30;

      border-radius:
        5px;

      text-align: center;
    }


    /* TEXT */

    .friends-title {
      margin:
        0
        0
        4px;

      font-family:
        "Bonbon",
        cursive;

      font-size:
        35px;

      line-height:
        1;

      color:
        #ff69a7;

      text-shadow:
        1px 1px 0 white,
        2px 2px 0 #d8b79f;
    }

    .subtitle {
      margin:
        4px
        0
        13px;

      font-family:
        "Unkempt",
        cursive;

      font-size:
        15px;

      color:
        #8d6757;
    }


    /* PASSWORD */

    #sitePassword {
      width:
        230px;

      max-width:
        100%;

      padding:
        9px
        11px;

      margin-bottom:
        8px;

      background:
        #fffdf7;

      border:
        3px double
        #d6b39b;

      border-radius:
        10px;

      outline:
        none;

      font-family:
        "Sour Gummy",
        sans-serif;

      font-size:
        14px;

      color:
        #755969;

      text-align:
        center;
    }

    #sitePassword:focus {
      border-color:
        #aa8069;

      background:
        #fffaf3;
    }


    /* PASSWORD BUTTONS */

    .password-buttons {
      display:
        flex;

      justify-content:
        center;

      flex-wrap:
        wrap;

      gap:
        4px;
    }

    #passwordButton,
    #hintButton {
      padding:
        7px
        12px;

      background:
        linear-gradient(
          #fffdf6,
          #ffe6f0
        );

      border:
        3px double
        #d6b39b;

      border-radius:
        9px;

      font-family:
        "Sour Gummy",
        sans-serif;

      font-size:
        13px;

      font-weight:
        bold;

      color:
        #a45e80;

      transition:
        transform .15s ease,
        background .15s ease;
    }

    #passwordButton:hover,
    #hintButton:hover {
      transform:
        scale(1.05);

      background:
        #fff3bd;
    }


    /* WRONG PASSWORD */

    #passwordError {
      min-height:
        17px;

      margin-top:
        7px;

      font-size:
        13px;

      color:
        #d55882;
    }


    /* FLOATING HINT CARD */

    #hintCard {
      position: absolute;

      left: calc(100% + 24px);
      top: 54%;

      transform:
        translateY(-50%)
        translateX(10px);

      width:
        235px;

      padding:
        14px
        15px;

      display:
        none;

      background:
        linear-gradient(
          #fff8f1,
          #ffe9f1
        );

      border:
        3px double
        #d6b39b;

      border-radius:
        16px;

      box-shadow:
        5px 6px 0
        rgba(177,116,142,.18);

      color:
        #855f52;

      text-align:
        center;

      font-family:
        "Unkempt",
        cursive;

      font-size:
        14px;

      line-height:
        1.35;

      z-index:
        20;
    }

    #hintCard.show {
      display:
        block;

      animation:
        hintSlideIn
        .25s ease;
    }

    @keyframes hintSlideIn {

      from {
        opacity:
          0;

        transform:
          translateY(-50%)
          translateX(20px);
      }

      to {
        opacity:
          1;

        transform:
          translateY(-50%)
          translateX(0);
      }

    }

    .hint-card-top {
      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      margin-bottom:
        7px;

      font-family:
        "Bonbon",
        cursive;

      font-size:
        24px;

      color:
        #ff6fa8;
    }

    #closeHint {
      width:
        25px;

      height:
        25px;

      padding:
        0;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      background:
        #fffaf3;

      border:
        2px solid
        #d7af99;

      border-radius:
        50%;

      color:
        #9a6c5f;

      font-family:
        Arial,
        sans-serif;

      font-size:
        13px;

      font-weight:
        bold;
    }

    #closeHint:hover {
      transform:
        scale(1.08);

      background:
        #fff0f4;
    }

    .hint-card-text {
      margin:
        0;

      color:
        #835f52;
    }

    .hint-card-text b {
      display:
        inline-block;

      margin-top:
        8px;

      color:
        #a65d79;
    }


    /* CIRCLE PAD */

    .circle-pad {
      position:
        absolute;

      left:
        24px;

      top:
        88px;

      width:
        55px;

      height:
        55px;

      border-radius:
        50%;

      background:
        radial-gradient(
          circle at 40% 35%,
          #f3cedf,
          #d397b1 55%,
          #b77593 100%
        );

      border:
        4px solid
        #a66c87;

      box-shadow:
        inset 0 3px 3px rgba(255,255,255,.35),
        0 2px 2px rgba(90,50,70,.18);

      z-index:
        3;
    }


    /* DPAD */

    .dpad {
      position:
        absolute;

      left:
        24px;

      bottom:
        56px;

      width:
        52px;

      height:
        52px;

      z-index:
        3;
    }

    .dpad::before,
    .dpad::after {
      content:
        "";

      position:
        absolute;

      background:
        #8d6377;

      border:
        2px solid
        #6e4e5e;

      border-radius:
        5px;
    }

    .dpad::before {
      width:
        18px;

      height:
        52px;

      left:
        17px;

      top:
        0;
    }

    .dpad::after {
      width:
        52px;

      height:
        18px;

      left:
        0;

      top:
        17px;
    }


    /* ABXY */

    .abxy {
      position:
        absolute;

      right:
        24px;

      bottom:
        50px;

      width:
        82px;

      height:
        82px;

      z-index:
        3;
    }

    .abxy span {
      position:
        absolute;

      width:
        30px;

      height:
        30px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      border-radius:
        50%;

      background:
        linear-gradient(
          #d9a0ba,
          #bb7797
        );

      border:
        3px solid
        #9c647f;

      box-shadow:
        inset 0 2px 2px rgba(255,255,255,.35),
        0 2px 2px rgba(100,60,80,.18);

      color:
        #fff7fb;

      font-family:
        Arial,
        sans-serif;

      font-size:
        11px;

      font-weight:
        bold;
    }

    .abxy .a {
      right:
        0;

      top:
        26px;
    }

    .abxy .b {
      left:
        26px;

      bottom:
        0;
    }

    .abxy .x {
      left:
        26px;

      top:
        0;
    }

    .abxy .y {
      left:
        0;

      top:
        26px;
    }


    /* POWER LIGHT */

    .power-light {
      position:
        absolute;

      right:
        23px;

      bottom:
        18px;

      width:
        7px;

      height:
        7px;

      background:
        #9cefa1;

      border-radius:
        50%;

      box-shadow:
        0 0 7px
        #8ff49a;
    }


    /* WRONG PASSWORD SHAKE */

    .wrong {
      animation:
        wrongShake
        .35s ease;
    }

    @keyframes wrongShake {

      0%,
      100% {
        transform:
          translateX(0);
      }

      25% {
        transform:
          translateX(-8px);
      }

      50% {
        transform:
          translateX(8px);
      }

      75% {
        transform:
          translateX(-5px);
      }

    }


    /* SUCCESS */

    .success-message {
      font-family:
        "Bonbon",
        cursive;

      font-size:
        27px;

      color:
        #ff6ba8;
    }


    /* SCROLLBAR */

    html,
    body {
      scrollbar-width:
        thin;

      scrollbar-color:
        #c59a82
        #f7e9df;
    }

    ::-webkit-scrollbar {
      width:
        11px;
    }

    ::-webkit-scrollbar-track {
      background:
        #f7e9df;
    }

    ::-webkit-scrollbar-thumb {
      background:
        linear-gradient(
          #d7b59e,
          #b98b74
        );

      border:
        2px solid
        #f7e9df;

      border-radius:
        20px;
    }


    /* MOBILE */

    @media
    (max-width: 900px) {

      body {
        align-items:
          flex-start;

        padding-top:
          25px;
      }

      .gate-layout {
        flex-direction:
          column;
      }

      .ds {
        width:
          95vw;
      }

      #hintCard {
        position:
          relative;

        left:
          auto;

        top:
          auto;

        transform:
          none;

        width:
          min(90vw, 340px);

        margin:
          16px auto 0;
      }

      #hintCard.show {
        display:
          block;

        animation:
          hintSlideDown
          .25s ease;
      }

      @keyframes hintSlideDown {

        from {
          opacity:
            0;

          transform:
            translateY(-8px);
        }

        to {
          opacity:
            1;

          transform:
            translateY(0);
        }

      }

    }


    @media
    (max-width: 620px) {

      .ds-top,
      .ds-bottom {
        padding-left:
          18px;

        padding-right:
          18px;
      }

      .top-screen {
        height:
          185px;
      }

      .bottom-bezel {
        width:
          300px;

        max-width:
          68%;
      }

      .circle-pad {
        left:
          9px;

        width:
          44px;

        height:
          44px;
      }

      .dpad {
        left:
          7px;

        transform:
          scale(.76);
      }

      .abxy {
        right:
          7px;

        transform:
          scale(.76);
      }

      .friends-title {
        font-size:
          29px;
      }

    }

  </style>

</head>


<body>


<div class="gate-layout">


  <div class="ds">


    <!-- TOP 3DS -->

    <div class="ds-top">


      <div class="camera-row">

        <div class="camera-light"></div>

        <div class="camera-dot"></div>

        <div class="camera-light"></div>

      </div>


      <div class="top-bezel">


        <div class="speaker-left"></div>


        <div class="top-screen">

          <iframe
            src="https://giphy.com/embed/TlxFVhOcW80JW"
            class="tomodachi-preview"
            frameborder="0"
            allowfullscreen
            title="tomodachi life"
          ></iframe>

        </div>


        <div class="speaker-right"></div>


      </div>


    </div>


    <!-- HINGE -->

    <div class="hinge-area">

      <div class="hinge"></div>

    </div>


    <!-- BOTTOM 3DS -->

    <div class="ds-bottom">


      <div class="circle-pad"></div>


      <div class="dpad"></div>


      <div class="abxy">

        <span class="a">
          A
        </span>

        <span class="b">
          B
        </span>

        <span class="x">
          X
        </span>

        <span class="y">
          Y
        </span>

      </div>


      <div class="bottom-bezel">

        <div
          class="bottom-screen"
          id="bottomScreen"
        >


          <div class="friends-title">
            friends only! ♡
          </div>


          <div class="subtitle">
            enter the password to visit mina's internet corner
          </div>


          <input
            type="password"
            id="sitePassword"
            placeholder="password..."
            autocomplete="off"
          >


          <div class="password-buttons">


            <button
              id="passwordButton"
              type="button"
            >
              ♡ let me in ♡
            </button>


            <button
              id="hintButton"
              type="button"
            >
              hint? ★
            </button>


          </div>


          <div id="passwordError"></div>


        </div>

      </div>


      <div class="power-light"></div>


    </div>


  </div>



  <!-- FLOATING HINT NOTIFICATION -->

  <div id="hintCard">


    <div class="hint-card-top">

      <span>
        hint! ♡
      </span>


      <button
        id="closeHint"
        type="button"
        aria-label="close hint"
      >
        ×
      </button>

    </div>


    <p class="hint-card-text">

      the fictional character i always post on my cf story
      and read ao3 fanfics abt.

      <br>

      <b>
        if you're my friend YOU'LL KNOW
      </b>

    </p>


  </div>


</div>



<script>


const PASSWORD_HASH =
  "99016520a0f3b6ebd7ea15ee2c67ab24daf8ff27b923eef8564aa92b64753ebe";


async function hashPassword(text) {

  const encoded =
    new TextEncoder()
      .encode(text);


  const hashBuffer =
    await crypto.subtle.digest(
      "SHA-256",
      encoded
    );


  const hashArray =
    Array.from(
      new Uint8Array(
        hashBuffer
      )
    );


  return hashArray
    .map(
      byte =>
        byte
          .toString(16)
          .padStart(2, "0")
    )
    .join("");

}


async function checkPassword() {

  const input =
    document
      .getElementById(
        "sitePassword"
      )
      .value
      .trim()
      .toLowerCase();


  const screen =
    document
      .getElementById(
        "bottomScreen"
      );


  const error =
    document
      .getElementById(
        "passwordError"
      );


  const enteredHash =
    await hashPassword(
      input
    );


  if (
    enteredHash ===
    PASSWORD_HASH
  ) {


    sessionStorage.setItem(
      "minaSiteUnlocked",
      "yes"
    );


    error.textContent =
      "";


    screen.innerHTML =
      `
      <div class="success-message">
        welcome!! ♡
        <br>
        (˶ᵔ ᵕ ᵔ˶)
      </div>
      `;


    setTimeout(
      function() {

        window.location.href =
          "index.html";

      },

      900
    );


  }


  else {


    error.textContent =
      "wrong password!! (╥﹏╥)";


    screen.classList.remove(
      "wrong"
    );


    void screen.offsetWidth;


    screen.classList.add(
      "wrong"
    );


  }

}



document
  .getElementById(
    "passwordButton"
  )
  .addEventListener(
    "click",
    checkPassword
  );



document
  .getElementById(
    "sitePassword"
  )
  .addEventListener(
    "keydown",
    function(event) {


      if (
        event.key ===
        "Enter"
      ) {

        checkPassword();

      }


    }
  );



const hintCard =
  document.getElementById(
    "hintCard"
  );


document
  .getElementById(
    "hintButton"
  )
  .addEventListener(
    "click",
    function() {


      hintCard
        .classList
        .toggle(
          "show"
        );


    }
  );



document
  .getElementById(
    "closeHint"
  )
  .addEventListener(
    "click",
    function() {


      hintCard
        .classList
        .remove(
          "show"
        );


    }
  );


</script>


</body>

</html>
